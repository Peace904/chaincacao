<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChainCacao — Traçabilité du lot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ===== VARIABLES ===== */
    :root {
      --cacao:    #3B1F0A;
      --terre:    #7A3B1E;
      --or:       #D4882A;
      --sable:    #F5EDD9;
      --feuille:  #2D5A27;
      --blanc:    #FDFAF4;
      --gris:     #8A7060;
      --bordure:  #E8D8BC;
      --ombre:    rgba(59,31,10,0.12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--blanc);
      color: var(--cacao);
      min-height: 100vh;
    }

    /* ===== HEADER ===== */
    header {
      background: var(--cacao);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 20px var(--ombre);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: var(--or);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
    }
    .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem; font-weight: 900;
      color: var(--sable);
    }
    .logo-text span { color: var(--or); }
    nav a {
      color: var(--sable);
      text-decoration: none;
      font-size: 0.875rem; font-weight: 500;
      opacity: 0.7; margin-left: 2rem;
      transition: opacity 0.2s;
    }
    nav a:hover { opacity: 1; color: var(--or); }

    /* ===== BREADCRUMB ===== */
    .breadcrumb {
      background: var(--sable);
      padding: 0.75rem 2rem;
      border-bottom: 1px solid var(--bordure);
      font-size: 0.83rem;
      color: var(--gris);
    }
    .breadcrumb a { color: var(--terre); text-decoration: none; font-weight: 500; }
    .breadcrumb a:hover { color: var(--or); }
    .breadcrumb .sep { margin: 0 0.5rem; }

    /* ===== LAYOUT ===== */
    .page-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 2.5rem 2rem;
      animation: fadeIn 0.5s ease;
    }

    /* ===== LOT HEADER CARD ===== */
    .lot-header {
      background: linear-gradient(135deg, var(--cacao), var(--terre));
      border-radius: 16px;
      padding: 2rem;
      color: var(--sable);
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 32px var(--ombre);
    }
    .lot-header::after {
      content: '🍫';
      position: absolute;
      right: 1.5rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 5rem;
      opacity: 0.12;
    }
    .lot-header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .lot-id-display {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--or);
      padding: 0.3rem 0.8rem;
      border-radius: 6px;
      margin-bottom: 0.75rem;
      display: inline-block;
    }
    .lot-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 0.25rem;
    }
    .lot-sub { color: rgba(245,237,217,0.7); font-size: 0.9rem; }

    /* Badge statut dans le header */
    .statut-badge-lg {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      background: var(--or);
      color: var(--cacao);
    }

    /* Méta-infos du lot */
    .lot-meta {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .meta-item {}
    .meta-item .label {
      font-size: 0.73rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(245,237,217,0.55);
      margin-bottom: 0.2rem;
    }
    .meta-item .value {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--sable);
    }

    /* ===== DEUX COLONNES ===== */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    /* ===== CARDS ===== */
    .card {
      background: #fff;
      border: 1px solid var(--bordure);
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: 0 2px 12px var(--ombre);
    }
    .card-title {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--or);
      margin-bottom: 1.25rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--bordure);
    }

    /* ===== DETAIL GRID ===== */
    .detail-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 0.88rem;
      gap: 1rem;
    }
    .detail-row .dk { color: var(--gris); font-weight: 500; flex-shrink: 0; }
    .detail-row .dv { font-weight: 600; text-align: right; }

    /* ===== BADGE QUALITÉ ===== */
    .badge-qualite {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .q-Standard   { background: #EAECEE; color: #566573; }
    .q-Premium    { background: #FEF9E7; color: #B7950B; }
    .q-Fairtrade  { background: #EAFAF1; color: #1E8449; }
    .q-Bio        { background: #EBF5FB; color: #1A5276; }

    /* ===== GPS CHIP ===== */
    .gps-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--sable);
      border: 1px solid var(--bordure);
      padding: 0.3rem 0.7rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--terre);
      margin-top: 0.5rem;
    }

    /* ===== NOTES ===== */
    .notes-block {
      background: var(--sable);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      font-size: 0.88rem;
      color: var(--cacao);
      line-height: 1.6;
      font-style: italic;
    }

    /* ===== TIMELINE HISTORIQUE ===== */
    .timeline-card { grid-column: 1 / -1; }
    .timeline { position: relative; padding-left: 2rem; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 0.6rem;
      top: 0.5rem;
      bottom: 0.5rem;
      width: 2px;
      background: linear-gradient(to bottom, var(--or), var(--bordure));
      border-radius: 2px;
    }
    .timeline-event {
      position: relative;
      padding: 1rem 1rem 1rem 1.25rem;
      margin-bottom: 1rem;
      background: var(--sable);
      border: 1px solid var(--bordure);
      border-radius: 10px;
      animation: fadeInRow 0.4s ease both;
    }
    .timeline-event:last-child { margin-bottom: 0; }
    .timeline-event::before {
      content: '';
      position: absolute;
      left: -1.8rem;
      top: 1.25rem;
      width: 12px;
      height: 12px;
      background: var(--or);
      border: 2px solid var(--blanc);
      border-radius: 50%;
      box-shadow: 0 0 0 2px var(--or);
    }
    .timeline-event:first-child::before {
      background: var(--feuille);
      box-shadow: 0 0 0 2px var(--feuille);
    }
    .event-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.4rem;
    }
    .event-etape {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--cacao);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .event-date {
      font-size: 0.78rem;
      color: var(--gris);
    }
    .event-acteur {
      font-size: 0.83rem;
      color: var(--terre);
      font-weight: 500;
      margin-bottom: 0.3rem;
    }
    .event-comment {
      font-size: 0.83rem;
      color: var(--gris);
      line-height: 1.5;
    }

    /* ===== TRANSFERT FORM ===== */
    .transfer-section {
      background: #fff;
      border: 2px dashed var(--or);
      border-radius: 14px;
      padding: 1.5rem;
      margin-top: 1.5rem;
    }
    .transfer-section .card-title { color: var(--terre); }
    .transfer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .field { display: flex; flex-direction: column; gap: 0.4rem; }
    .field.full { grid-column: 1 / -1; }
    label { font-size: 0.85rem; font-weight: 600; color: var(--cacao); }
    input, select, textarea {
      padding: 0.65rem 1rem;
      border: 1.5px solid var(--bordure);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      background: var(--sable);
      color: var(--cacao);
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--or);
      background: #fff;
    }
    textarea { resize: vertical; min-height: 60px; }

    /* ===== BUTTONS ===== */
    .btn-primary {
      background: var(--or);
      color: var(--cacao);
      border: none;
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 2px 8px rgba(212,136,42,0.3);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(212,136,42,0.4);
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--gris);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: color 0.2s;
      margin-bottom: 1.5rem;
    }
    .btn-back:hover { color: var(--cacao); }

    /* ===== QR CODE PLACEHOLDER ===== */
    .qr-section {
      text-align: center;
      padding: 1.5rem 1rem;
    }
    .qr-box {
      width: 120px;
      height: 120px;
      background: var(--sable);
      border: 2px dashed var(--bordure);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 0.75rem;
    }
    .qr-label { font-size: 0.78rem; color: var(--gris); }

    /* ===== EUDR BADGE ===== */
    .eudr-badge {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: linear-gradient(135deg, #D4EFDF, #A9DFBF);
      border: 1px solid #82E0AA;
      border-radius: 10px;
      padding: 0.85rem 1rem;
      margin-top: 1rem;
    }
    .eudr-icon { font-size: 1.5rem; }
    .eudr-text strong { display: block; font-size: 0.85rem; color: #1E8449; }
    .eudr-text span { font-size: 0.78rem; color: #27AE60; }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--feuille);
      color: #fff;
      padding: 1rem 1.5rem;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 500;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      transform: translateY(120%);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 999;
    }
    .toast.show { transform: translateY(0); }

    /* ===== NOT FOUND ===== */
    .not-found {
      text-align: center;
      padding: 5rem 2rem;
    }
    .not-found .nf-icon { font-size: 4rem; margin-bottom: 1rem; }
    .not-found h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .not-found p { color: var(--gris); margin-bottom: 2rem; }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInRow {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px) {
      .two-col { grid-template-columns: 1fr; }
      .timeline-card { grid-column: 1; }
      .transfer-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: 1; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <a href="index.html" class="logo">
    <div class="logo-icon">🍫</div>
    <div class="logo-text">Chain<span>Cacao</span></div>
  </a>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="create.html">Nouveau lot</a>
  </nav>
</header>

<!-- BREADCRUMB -->
<div class="breadcrumb">
  <a href="index.html">Dashboard</a>
  <span class="sep">›</span>
  <span id="breadcrumbId">Traçabilité</span>
</div>

<!-- CONTENU PRINCIPAL -->
<div class="page-wrap" id="pageContent">
  <!-- Injecté par JS -->
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <span>🔄</span>
  <div><strong>Transfert enregistré !</strong></div>
</div>

<script>
  // ===== UTILITAIRES LOCALSTORAGE =====

  function getLots() {
    return JSON.parse(localStorage.getItem('chaincacao_lots') || '[]');
  }
  function saveLots(lots) {
    localStorage.setItem('chaincacao_lots', JSON.stringify(lots));
  }

  /**
   * Récupère l'ID lot depuis l'URL (paramètre ?id=...)
   */
  function getLotIdFromUrl() {
    return new URLSearchParams(window.location.search).get('id');
  }

  /**
   * Trouve un lot par son ID.
   */
  function findLot(id) {
    return getLots().find(l => l.id === id) || null;
  }

  // ===== FORMATAGE =====

  function formatDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('fr-FR', {
      day: '2-digit', month: 'long', year: 'numeric'
    });
  }

  function formatDateTime(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString('fr-FR', {
      day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  /**
   * Renvoie l'icône et les classes de badge selon le statut.
   */
  const STATUT_MAP = {
    'Ferme':        { icon: '🌿', cls: 'badge-ferme' },
    'Coopérative':  { icon: '🏭', cls: 'badge-coop' },
    'En transit':   { icon: '🔄', cls: 'badge-transit' },
    'Exportateur':  { icon: '🚢', cls: 'badge-export' },
  };

  function statutIcon(s) {
    return (STATUT_MAP[s] || {icon: '📦'}).icon;
  }

  function qualiteCls(q) {
    return { 'Standard':'q-Standard', 'Premium':'q-Premium',
             'Fairtrade':'q-Fairtrade', 'Bio certifié':'q-Bio' }[q] || 'q-Standard';
  }

  // ===== RENDU PRINCIPAL =====

  /**
   * Affiche la page de traçabilité pour un lot donné.
   */
  function renderPage(lot) {
    document.getElementById('breadcrumbId').textContent = lot.id;
    document.title = `ChainCacao — ${lot.id}`;

    const gpsInfo = (lot.gpsLat && lot.gpsLon)
      ? `<span class="gps-chip">📍 ${lot.gpsLat.toFixed(4)}, ${lot.gpsLon.toFixed(4)}</span>`
      : '<span style="color:var(--gris);font-size:0.83rem">Non renseignées</span>';

    const notesHTML = lot.notes
      ? `<div class="notes-block">"${lot.notes}"</div>`
      : '<span style="color:var(--gris);font-size:0.85rem">Aucune note.</span>';

    const timelineHTML = [...lot.historique].reverse().map((ev, i) => `
      <div class="timeline-event" style="animation-delay:${i*0.07}s">
        <div class="event-header">
          <div class="event-etape">${statutIcon(ev.etape)} ${ev.etape}</div>
          <div class="event-date">${formatDateTime(ev.date)}</div>
        </div>
        <div class="event-acteur">👤 ${ev.acteur}</div>
        <div class="event-comment">${ev.commentaire || ''}</div>
      </div>
    `).join('');

    const eudrStatus = lot.statut === 'Exportateur'
      ? `<div class="eudr-badge">
           <span class="eudr-icon">🇪🇺</span>
           <div class="eudr-text">
             <strong>Conforme EUDR</strong>
             <span>Ce lot dispose d'une traçabilité complète pour l'exportation UE.</span>
           </div>
         </div>`
      : '';

    document.getElementById('pageContent').innerHTML = `
      <a href="index.html" class="btn-back">← Retour au dashboard</a>

      <!-- EN-TÊTE DU LOT -->
      <div class="lot-header">
        <div class="lot-header-top">
          <div>
            <div class="lot-id-display">${lot.id}</div>
            <div class="lot-name">${lot.producteur}</div>
            <div class="lot-sub">${lot.espece} · ${lot.origine}${lot.region ? ', ' + lot.region : ''}</div>
          </div>
          <div class="statut-badge-lg">
            ${statutIcon(lot.statut)} ${lot.statut}
          </div>
        </div>
        <div class="lot-meta">
          <div class="meta-item">
            <div class="label">Poids</div>
            <div class="value">${parseFloat(lot.poids).toLocaleString('fr-FR')} kg</div>
          </div>
          <div class="meta-item">
            <div class="label">Récolte</div>
            <div class="value">${formatDate(lot.dateRecolte)}</div>
          </div>
          <div class="meta-item">
            <div class="label">Étapes tracées</div>
            <div class="value">${lot.historique.length}</div>
          </div>
          <div class="meta-item">
            <div class="label">Qualité</div>
            <div class="value">${lot.qualite}</div>
          </div>
        </div>
      </div>

      <!-- GRILLE 2 COLONNES -->
      <div class="two-col">

        <!-- Détails du lot -->
        <div class="card">
          <div class="card-title">📋 Détails du lot</div>
          <div class="detail-list">
            <div class="detail-row">
              <span class="dk">ID Lot</span>
              <span class="dv" style="font-family:monospace;font-size:0.82rem;color:var(--terre)">${lot.id}</span>
            </div>
            <div class="detail-row">
              <span class="dk">Producteur</span>
              <span class="dv">${lot.producteur}</span>
            </div>
            <div class="detail-row">
              <span class="dk">Espèce</span>
              <span class="dv">${lot.espece}</span>
            </div>
            <div class="detail-row">
              <span class="dk">Qualité</span>
              <span class="dv"><span class="badge-qualite ${qualiteCls(lot.qualite)}">${lot.qualite}</span></span>
            </div>
            <div class="detail-row">
              <span class="dk">Poids</span>
              <span class="dv">${parseFloat(lot.poids).toLocaleString('fr-FR')} kg</span>
            </div>
            <div class="detail-row">
              <span class="dk">Date récolte</span>
              <span class="dv">${formatDate(lot.dateRecolte)}</span>
            </div>
            <div class="detail-row">
              <span class="dk">Enregistré le</span>
              <span class="dv">${formatDateTime(lot.dateCreation)}</span>
            </div>
          </div>
        </div>

        <!-- Origine géographique -->
        <div class="card">
          <div class="card-title">📍 Origine géographique</div>
          <div class="detail-list">
            <div class="detail-row">
              <span class="dk">Village</span>
              <span class="dv">${lot.origine}</span>
            </div>
            <div class="detail-row">
              <span class="dk">Région</span>
              <span class="dv">${lot.region || '—'}</span>
            </div>
            <div class="detail-row">
              <span class="dk">Pays</span>
              <span class="dv">🇹🇬 Togo</span>
            </div>
            <div class="detail-row">
              <span class="dk">Coordonnées GPS</span>
              <span class="dv">${gpsInfo}</span>
            </div>
          </div>
          ${eudrStatus}
        </div>

        <!-- Notes -->
        <div class="card">
          <div class="card-title">📝 Notes</div>
          ${notesHTML}
        </div>

        <!-- QR Code (simulé) -->
        <div class="card">
          <div class="card-title">🔗 Vérification</div>
          <div class="qr-section">
            <div class="qr-box">⬛</div>
            <div class="qr-label">
              QR Code de traçabilité<br>
              <strong style="color:var(--cacao);font-size:0.82rem;font-family:monospace">${lot.id}</strong>
            </div>
            <div style="margin-top:1rem;font-size:0.78rem;color:var(--gris)">
              À scanner pour vérification instantanée par importateur / organisme de certification.
            </div>
          </div>
        </div>

        <!-- TIMELINE HISTORIQUE (pleine largeur) -->
        <div class="card timeline-card">
          <div class="card-title">⛓️ Historique de traçabilité — ${lot.historique.length} étape(s)</div>
          <div class="timeline">
            ${timelineHTML}
          </div>
        </div>

      </div>

      <!-- SECTION TRANSFERT -->
      <div class="transfer-section">
        <div class="card-title">🔄 Enregistrer un transfert</div>
        <p style="font-size:0.88rem;color:var(--gris);margin-bottom:1.25rem">
          Indiquez la prochaine étape de la chaîne de valeur pour ce lot.
        </p>
        <div class="transfer-grid">
          <div class="field">
            <label for="tEtape">Nouvelle étape <span style="color:var(--or)">*</span></label>
            <select id="tEtape">
              <option value="Coopérative">🏭 Coopérative</option>
              <option value="Transformateur">🔧 Transformateur</option>
              <option value="En transit">🔄 En transit</option>
              <option value="Exportateur">🚢 Exportateur</option>
              <option value="Certification">🏅 Certification</option>
            </select>
          </div>
          <div class="field">
            <label for="tActeur">Nom de l'acteur / entité <span style="color:var(--or)">*</span></label>
            <input type="text" id="tActeur" placeholder="Ex: STE CacaoExport SA, Bureau Veritas…" />
          </div>
          <div class="field full">
            <label for="tComment">Commentaire</label>
            <textarea id="tComment" placeholder="Ex: Lot pesé et accepté, certificat n° 2026-TG-084…"></textarea>
          </div>
        </div>
        <button class="btn-primary" onclick="addTransfer('${lot.id}')">
          🔄 Valider le transfert
        </button>
      </div>
    `;
  }

  // ===== PAGE NOT FOUND =====

  function renderNotFound(id) {
    document.getElementById('pageContent').innerHTML = `
      <div class="not-found">
        <div class="nf-icon">🔍</div>
        <h2>Lot introuvable</h2>
        <p>Aucun lot avec l'identifiant <strong>${id || '?'}</strong> n'a été trouvé.</p>
        <a href="index.html" class="btn-primary" style="display:inline-flex">← Retour au dashboard</a>
      </div>
    `;
  }

  // ===== TRANSFERT =====

  /**
   * Ajoute un événement de transfert à l'historique du lot.
   */
  function addTransfer(lotId) {
    const etape   = document.getElementById('tEtape').value;
    const acteur  = document.getElementById('tActeur').value.trim();
    const comment = document.getElementById('tComment').value.trim();

    if (!acteur) {
      document.getElementById('tActeur').style.borderColor = '#C0392B';
      document.getElementById('tActeur').focus();
      return;
    }

    // Mise à jour du lot dans localStorage
    const lots = getLots();
    const idx = lots.findIndex(l => l.id === lotId);
    if (idx === -1) return;

    const ev = {
      etape,
      acteur,
      date:       new Date().toISOString(),
      commentaire: comment || `Transfert vers ${etape} — ${acteur}`,
    };

    lots[idx].statut = etape;
    lots[idx].historique.push(ev);
    saveLots(lots);

    // Toast + rechargement
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
      renderPage(lots[idx]); // Re-render sans recharger la page
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 1500);
  }

  // ===== INIT =====
  (function init() {
    const id  = getLotIdFromUrl();
    const lot = id ? findLot(id) : null;

    if (lot) {
      renderPage(lot);
    } else {
      renderNotFound(id);
    }
  })();
</script>

</body>
</html>
